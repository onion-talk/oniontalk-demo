name: OnionTalk SecOps — Zero-Leak, Anti-Hardcode & Disclaimer Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-leak-and-disclaimer-gate:
    name: "🛡️ Strix Zero-Leak, Anti-Hardcode & Release Disclaimer Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Mandatory Zero-Leak & Anti-Hardcode Scanner
        run: python3 scripts/zero_leak_scanner.py

      - name: Verify Latest Release Hash (vs GitHub digest) & Legal Disclaimer Integrity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_release_docs.py
