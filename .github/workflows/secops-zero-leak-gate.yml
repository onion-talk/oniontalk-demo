name: OnionTalk SecOps — Zero-Leak, Anti-Hardcode & Disclaimer Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-leak-and-disclaimer-gate:
    name: "🛡️ Strix Zero-Leak, Anti-Hardcode & v1.5.0 Disclaimer Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Mandatory Zero-Leak & Anti-Hardcode Scanner
        run: python3 scripts/zero_leak_scanner.py

      - name: Verify v1.5.0 Release Hashes & Legal Disclaimer Integrity
        run: |
          python3 - <<'EOF'
          import pathlib
          root = pathlib.Path(".")
          readme = (root / "README.md").read_text(encoding="utf-8")
          assert "v1.5.0" in readme, "README.md must document v1.5.0"
          assert "Legal Disclaimers" in readme, "README.md must include Legal Disclaimers section"
          assert "4a5472a26444cbfdad7ed5dbab76e1e88ab64824d18df95694e6cd741a66dc6f" in readme, "README.md missing v1.5.0 APK SHA-256"
          for html_name in ["index.html", "privacy.html", "docs/index.html", "docs/privacy.html"]:
              p = root / html_name
              if p.exists():
                  txt = p.read_text(encoding="utf-8")
                  assert "v1.5.0 (Build 36)" in txt, f"{html_name} missing v1.5.0 (Build 36)"
                  assert "Disclaimers Legais, Isenção de Responsabilidade" in txt, f"{html_name} missing Clause 7 Legal Disclaimers"
          print("[SECOPS-DOCS-GATE] PASS: v1.5.0 hashes and Legal Disclaimers verified.")
          EOF