services:
  oniontalk-web:
    image: eriktonon/oniontalk-web:latest
    container_name: oniontalk-web
    restart: unless-stopped
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - oniontalk_web_vault:/data
      - oniontalk_web_tor:/var/lib/tor
    environment:
      - PORT=8420
      - TOR_SOCKS_PORT=9050
      - ONIONTALK_DATA_DIR=/data

volumes:
  oniontalk_web_vault:
  oniontalk_web_tor:
